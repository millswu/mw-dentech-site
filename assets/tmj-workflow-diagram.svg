<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AxisGuide functional TMJ and occlusal planning workflow</title>
  <desc id="desc">A clean medical-digital workflow showing records, joint evaluation, mandibular position planning, and lab-ready outputs.</desc>
